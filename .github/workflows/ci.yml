name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Nothing here needs to write anything. Pinned rather than left to the repository
# default so a step that later wants a token has to ask for it on purpose.
permissions:
  contents: read

jobs:
  test:
    name: Build and test
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          swift --version
          xcodebuild -version
          sw_vers

      - name: Build
        run: swift build

      # Release, because the performance budgets skip themselves in debug —
      # a budget calibrated against an unoptimised build asserts nothing.
      - name: Test
        run: swift test -c release

      # The only check that actually proves the platform split. `swift test` compiles
      # for the host, so an `#if os(iOS)` branch is never built by it and rots in
      # silence — this caught .docFormat, which AppKit vends and UIKit does not, and
      # a symbolic-traits case the two frameworks spell differently.
      #
      # No signing identity needed, so it runs on a stock runner.
      - name: Build the libraries for iOS
        run: |
          for scheme in SummonKit SummonUI; do
            echo "==> $scheme"
            xcodebuild -scheme "$scheme" \
              -destination 'generic/platform=iOS' \
              build CODE_SIGNING_ALLOWED=NO | tail -5
          done

      # The app on top of them. Without this the libraries could stay green while the
      # thing that uses them stopped building — and the app target is where an
      # unavailable API or a missing conformance actually shows up.
      - name: Build the iOS app
        run: |
          xcodebuild -project Summon.xcodeproj -scheme SummonPhone \
            -destination 'generic/platform=iOS Simulator' \
            build CODE_SIGNING_ALLOWED=NO | tail -5
