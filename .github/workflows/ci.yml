name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Build and test
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          swift --version
          xcodebuild -version
          sw_vers

      - name: Build
        run: swift build

      # Release, because the performance budgets skip themselves in debug —
      # a budget calibrated against an unoptimised build asserts nothing.
      - name: Test
        run: swift test -c release
